<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyUp – Daily Schedule Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#595959;--line:#d9d9d9;--acc:#000;--now:#000;--done:#000;--glow:none;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="purple"]{--bg:#ece6fb;--card:#f8f5ff;--ink:#2a1b4d;--mute:#6b5a93;--line:#d3c8ef;--acc:#7b3fe4;--now:#2b7de9;--done:#2f9e8f;--glow:0 0 18px rgba(123,63,228,.25)}
:root[data-theme="light"]{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5c6b85;--line:#d5dce7;--acc:#2f6fed;--now:#e8451e;--done:#2f9e6e;--glow:none}
:root[data-theme="dark"]{--bg:#0d0a1a;--card:#1a1433;--ink:#ece6ff;--mute:#a595cf;--line:#32285a;--acc:#9b6dff;--now:#4cc9ff;--done:#4cc995;--glow:0 0 18px rgba(155,109,255,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 110px}
header{text-align:center}
h1{font-family:'Unbounded','Bricolage Grotesque',system-ui,sans-serif;font-size:2rem;font-weight:900;margin:0;letter-spacing:-.03em;color:var(--acc);text-shadow:var(--glow)}
.sub{color:var(--mute);margin:0}
.nav{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px}
.date{margin:4px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,.chk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.prog,.panel{box-shadow:var(--glow)}
.panel{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel[hidden]{display:none}
.panel label{display:grid;gap:4px;font-weight:600}
@media (max-width:480px){.panel{grid-template-columns:1fr}}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.prog{margin:20px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.prog b{font-size:1.6rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .35s}
form{display:grid;grid-template-columns:110px 1fr auto;gap:8px;margin-bottom:20px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.add{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
@media (max-width:480px){form{grid-template-columns:1fr 1fr}form input[type=text]{grid-column:1/3}.add{grid-column:1/3}}
#list{position:relative;margin:0;padding:0;list-style:none;border-left:2px solid var(--line);margin-left:6px}
li.row{position:relative;display:flex;gap:12px;align-items:center;padding:12px 12px 12px 18px;margin:0 0 8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
li.row::before{content:"";position:absolute;left:-21px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--tc,var(--acc))}
li.row.done::before{background:var(--done)}
li.row.done .t{text-decoration:line-through;color:var(--mute)}
.time{font-weight:600;min-width:62px;font-variant-numeric:tabular-nums}
.t{flex:1;word-break:break-word}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.del{border:0;background:none;color:var(--mute);font-size:1.2rem;padding:4px 8px}
.del:hover{color:var(--now)}
.now{list-style:none;position:relative;margin:4px 0 12px -8px;display:flex;align-items:center;gap:8px;color:var(--now);font-weight:600;font-size:.85rem}
.now::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--now);flex:none}
.now::after{content:"";flex:1;height:2px;background:var(--now)}
.empty{color:var(--mute);padding:24px 8px;text-align:center}
.view[hidden]{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:.72rem;color:var(--mute);padding:4px 0}
.tabs button span{display:grid;place-items:center;width:54px;height:30px;border-radius:15px;transition:background .2s}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true] span{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.tabs em{font-style:normal}
.tabs button[aria-selected=true]{color:var(--acc);font-weight:600}
.tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.wk.sel{border-color:var(--acc);box-shadow:var(--glow)}
.wk .time{min-width:84px}
.wk .bar{flex:1;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--glow)}
.stat b{display:block;font-size:2rem;color:var(--acc)}
.greet{margin:6px 0 0;font-weight:600}
.span2{grid-column:1/-1}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{min-width:36px;height:36px;border-radius:18px;border:2px solid var(--line);padding:0 10px;font-size:.75rem;color:var(--ink)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.calh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.calh b{font-size:1.1rem}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:.8rem;padding:4px 0}
.cd{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;align-content:center;gap:2px;padding:0}
.cd.today{border-color:var(--acc);font-weight:700;box-shadow:var(--glow)}
.cd i{width:6px;height:6px;border-radius:50%}
.cd i.some{background:var(--mute)}
.cd i.all{background:var(--done)}
.cd:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#bwrap{will-change:transform;position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 28px)}
#bwrap[hidden],.bt[hidden],.bp[hidden]{display:none}
.fab{width:62px;height:90px;background:none;border:0;padding:0;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 3px 6px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.fab:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.fab,.pipsvg *{animation:none!important}}
.pipsvg g{transform-box:view-box}
.lleg{transform-origin:43px 116px}.rleg{transform-origin:57px 116px}.larm{transform-origin:35px 92px}.rarm{transform-origin:65px 92px}
.pipsvg.walk .lleg,.pipsvg.walk .rarm{animation:swing .6s ease-in-out infinite}
.pipsvg.walk .rleg,.pipsvg.walk .larm{animation:swing .6s ease-in-out infinite reverse}
@keyframes swing{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.pipsvg.wave .rarm{animation:wave .7s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(-122deg)}}
.pipsvg[data-m=cheer] .rarm{transform:rotate(-100deg)}
.pipsvg[data-m=cheer] .larm{transform:rotate(100deg)}
#bprints{position:fixed;inset:0;pointer-events:none}
.fp{position:absolute;background:var(--acc);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;opacity:.45;transition:opacity 1.2s}
#bprints{z-index:6}
.pipsvg .sv{display:none}
.pipsvg.side .sv{display:inline}
.pipsvg.side .fv,.pipsvg.side .m{display:none!important}
.sbleg{transform-origin:47px 116px}.sfleg{transform-origin:53px 116px}.sbarm,.sfarm{transform-origin:50px 92px}
.pipsvg.walk .sfleg,.pipsvg.walk .sbarm{animation:swing2 .6s ease-in-out infinite}
.pipsvg.walk .sbleg,.pipsvg.walk .sfarm{animation:swing2 .6s ease-in-out -.3s infinite}
@keyframes swing2{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.pipsvg.walk{animation:stepbob .3s ease-in-out infinite}
@keyframes stepbob{50%{transform:translateY(-3px)}}
.pipsvg.turn{animation:turn .5s ease-in-out}
@keyframes turn{50%{transform:scaleX(.12)}}
#bwrap.going .fab{animation:none}
#bveil{position:fixed;inset:0;z-index:6;background:color-mix(in srgb,var(--bg) 72%,transparent);transition:opacity .6s}
#bgreet{position:fixed;left:50%;top:calc(50% - 215px);transform:translateX(-50%);z-index:8;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:10px 16px;width:max-content;max-width:min(300px,86vw);text-align:center;font-weight:600;box-shadow:var(--glow)}
#bveil[hidden],#bgreet[hidden]{display:none}
.pipsvg{width:100%;height:100%;display:block}
.pipsvg .m{display:none}
.pipsvg[data-m=happy] .happy,.pipsvg[data-m=think] .think,.pipsvg[data-m=cheer] .cheer,.pipsvg[data-m=sleep] .sleep{display:inline}
.bt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;box-shadow:var(--glow);max-width:240px}
.bp{width:min(320px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--glow),0 6px 20px rgba(0,0,0,.18);overflow:hidden}
.bh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bh .pipsvg{width:38px;height:38px}
.bh b{flex:1}
#blog{max-height:190px;overflow:auto;padding:10px;display:grid;gap:6px}
.bm{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 10px;font-size:.9rem;justify-self:start;max-width:90%}
.bm.me{justify-self:end;background:var(--acc);color:#fff;border-color:var(--acc);border-radius:12px 12px 4px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 10px;font-size:.8rem}
.chip:hover{border-color:var(--acc)}
.bf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);margin:0}
.bf input{flex:1}
.t small{display:block;color:var(--mute);font-size:.78rem;line-height:1.35}
.plus{position:fixed;left:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--card);font-size:2rem;line-height:1;padding:0 0 3px;box-shadow:var(--glow),0 4px 14px rgba(0,0,0,.25)}
.plus:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
body.adding #bwrap{display:none}
.plus[hidden]{display:none}
.ah{display:flex;align-items:center;gap:12px;margin:16px 0}
.ah b{font-size:1.25rem}
#af{grid-template-columns:1fr;gap:16px;margin:0}
#af label{display:grid;gap:4px;font-weight:600}
#af .add{grid-column:auto;padding:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ty{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px}
.ty i{width:10px;height:10px;border-radius:50%}
.ty.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ah .btn:last-child:not(:first-child){margin-left:auto}
.panel .cust{display:flex;align-items:center;gap:10px;margin-top:10px}
.cust input{width:44px;height:36px;padding:2px}
#tf label{display:grid;gap:4px;font-weight:600}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--glow)}
.tcard b{font-size:1.05rem}
.tcard p{margin:4px 0}
.tcard details{margin:8px 0}
.tcard summary{cursor:pointer;color:var(--acc);font-weight:600}
.tcard ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:.88rem}
.tcard li{display:flex;gap:10px}
.tcard li span:first-child{min-width:68px;font-weight:600}
.tcard .add{width:100%;margin-top:6px;padding:10px}
</style>
</head>
<body>
<main>
  <header><h1>StudyUp</h1><p class="greet" id="greet" hidden></p><p class="sub date" id="dateLbl"></p></header>
  <div class="view" id="v-day">
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous day">‹</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="next" aria-label="Next day">›</button>
    </div>
    <section class="prog" aria-live="polite">
      <b id="pct">0%</b> <span class="sub" id="cnt">done</span>
      <div class="bar"><i id="fill"></i></div>
    </section>
    <ul id="list"></ul>
  </div>
  <div class="view" id="v-add" hidden>
    <div class="ah"><button class="btn" id="aBack" type="button" aria-label="Back">‹</button><b id="aTitleH">New task</b><button class="btn" id="tplBtn" type="button">Templates</button></div>
    <form id="af">
      <label><span id="aName">Task name</span><input type="text" id="nTitle" required maxlength="120"></label>
      <div><b id="aType">Type</b><div class="types" id="types"></div></div>
      <div class="row2"><label><span id="aDate">Date</span><input type="date" id="nDate" required></label><label><span id="aTime">Start time</span><input type="time" id="nTime" required></label></div>
      <div class="row2"><label><span id="aDur">Duration</span><select id="nDur"></select></label><label><span id="aPri">Priority</span><select id="nPri"></select></label></div>
      <label><span id="aRep">Repeat</span><select id="nRep"></select></label>
      <div><b id="aColor">Color</b><div class="swatches" id="nSw"></div></div>
      <label><span id="aNote">Notes</span><input type="text" id="nNote" maxlength="140"></label>
      <button class="add" type="submit" id="aSave">Save task</button>
    </form>
  </div>
  <div class="view" id="v-tpl" hidden>
    <div class="ah"><button class="btn" id="tBack" type="button" aria-label="Back">‹</button><b id="tplTitle">Study templates</b></div>
    <div class="row2" id="tf"><label><span id="tplDate">Start date</span><input type="date" id="tDate"></label><label><span id="tplRep">Apply for</span><select id="tRep"></select></label></div>
    <div id="tplList"></div>
  </div>
  <div class="view" id="v-week" hidden><div id="week"></div></div>
  <div class="view" id="v-cal" hidden>
    <div class="calh"><button class="btn" id="calPrev">‹</button><b id="calTitle"></b><button class="btn" id="calNext">›</button></div>
    <div class="cgrid" id="cal"></div>
  </div>
  <div class="view" id="v-stats" hidden><div id="stats" class="stats"></div></div>
  <div class="view" id="v-set" hidden>
    <section class="panel" id="panel">
      <label><span id="lLang">Language</span><select id="lang"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="hi">हिन्दी</option></select></label>
      <label><span id="lTheme">Theme</span><select id="theme"></select></label>
      <label class="span2"><span id="lName">Your name</span><input type="text" id="pName" maxlength="24"></label>
      <div class="span2"><b id="lAcc">Accent color</b><div class="swatches" id="sw"></div><label class="cust"><span id="lCust">Custom color</span><input type="color" id="cust"></label></div>
      <label><span id="lSize">Text size</span><select id="size"></select></label>
      <label><span id="lTime">Time format</span><select id="tfmt"></select></label>
      <label class="span2"><span id="lBot">Assistant</span><select id="botSel"></select></label>
      <label class="span2"><span id="lWeek">Week starts on</span><select id="wk"></select></label>
    </section>
  </div>
</main>
<button class="plus" id="plus" aria-label="New task">+</button>
<div id="bveil" hidden></div><div id="bgreet" hidden></div><div id="bprints"></div>
<div id="bwrap">
  <div class="bt" id="btoast" hidden></div>
  <section class="bp" id="bpanel" hidden>
    <div class="bh" id="bhead"><b>Xi</b><button class="btn" id="bclose" aria-label="Close">×</button></div>
    <div id="blog" aria-live="polite"></div>
    <div class="chips"><button class="chip" id="cN"></button><button class="chip" id="cP"></button><button class="chip" id="cC"></button></div>
    <form class="bf" id="bform"><input type="text" id="bin" maxlength="140" aria-label="Xi"><button class="add" type="submit">›</button></form>
  </section>
  <button class="fab" id="fab" aria-label="Xi" aria-expanded="false"></button>
</div>
<nav class="tabs" role="tablist">
  <button data-tab="week" role="tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><em class="lbl"></em></button>
  <button data-tab="cal" role="tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></span><em class="lbl"></em></button>
  <button data-tab="day" role="tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><em class="lbl"></em></button>
  <button data-tab="stats" role="tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></span><em class="lbl"></em></button>
  <button data-tab="set" role="tab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><em class="lbl"></em></button>
</nav>

<script>

function render() {
  const list = tasks().sort((a,b) => a.time.localeCompare(b.time));
  $('dateLbl').textContent = current.toLocaleDateString(L[lang].loc, {weekday:'long', month:'long', day:'numeric'});

}

  w.style.cssText = 'transition:none;opacity:0;pointer-events:none;transform:translate(' + dx + 'px,' + (dy + 140) + 'px) scale(.5)';
  g.textContent = tr('bHi', P.name); v.hidden = false; v.style.opacity = '1'; v.onclick = end;
  void w.offsetWidth;
  w.style.transition = 'transform .9s cubic-bezier(.2,1.2,.4,1),opacity .5s';
  w.style.opacity = '1'; w.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(2.3)';
  svg.classList.add('wave'); later(() => { g.hidden = false; }, 700);
  later(() => { g.hidden = true; v.style.opacity = '0'; svg.classList.remove('wave'); svg.classList.add('turn'); }, 3600);
  later(() => svg.classList.add('side'), 3850);
  later(() => { svg.classList.remove('turn'); svg.classList.add('walk'); w.style.transition = 'transform 5.5s cubic-bezier(.45,0,.55,1)'; w.style.transform = 'none'; iv = setInterval(step, 300); }, 4120);
  later(() => { clearInterval(iv); svg.classList.remove('walk'); svg.classList.add('turn'); }, 9700);
  later(() => svg.classList.remove('side'), 9950);
  later(end, 10250);
}
$('lang').onchange = e => { lang = e.target.value; try { localStorage.setItem('daybook-lang', lang); } catch (x) {} prefs(); show(tab); };
$('theme').onchange = e => { theme = e.target.value; try { localStorage.setItem('daybook-theme2', theme); } catch (x) {} prefs(); };
setInterval(() => { if (tab === 'day' && isToday()) render(); }, 60000);
prefs(); show('day'); intro();
